<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Görüntüleyici | Muhammet Ali Oruç</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 20px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

            .back-btn:hover {
                background: rgba(255, 255, 255, 0.4);
            }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 5px 0;
        }

        p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin: 0;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #38bdf8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>
        <h1>3D Oyun Varlıkları & Modeller</h1>
        <p>Modeli döndürmek için tıklayıp sürükleyin, yakınlaşmak için tekerleği kullanın.</p>
    </div>

    <div id="loading" class="loading">Model Yükleniyor...</div>
    <div id="canvas-container"></div>

    <!-- Three.js ve FBX Yükleyici Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(100, 300, 200);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0x94a3b8, 1);
        backLight.position.set(-100, -100, -200);
        scene.add(backLight);

        // FBX Model Yükleme (models klasörünün içindeki modelin.fbx dosyası)
        const loader = new THREE.FBXLoader();
        loader.load('models/merdiven.fbx', function (object) {

            object.scale.set(1, 1, 1);

            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center);

            scene.add(object);
            loadingEl.style.display = 'none';

        }, undefined, function (error) {
            console.error('FBX yüklenirken hata oluştu:', error);
            loadingEl.innerText = 'Model yüklenirken bir hata oluştu!';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
